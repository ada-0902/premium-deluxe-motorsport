<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Convertisseur PDM</title>
</head>

<body>

    <h1>Convertisseur CSV → vehicles.js</h1>

    <input type="file" id="csvFile" accept=".csv">

    <h2 id="resultat">
        Aucun fichier sélectionné
    </h2>

    <script>

        const input = document.getElementById("csvFile");
        const resultat = document.getElementById("resultat");


        function slugify(text) {

            return text
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");

        }


        function parseCSV(text) {

            const rows = [];

            let row = [];
            let value = "";
            let insideQuotes = false;


            for (let i = 0; i < text.length; i++) {

                const char = text[i];


                if (char === '"') {

                    if (
                        insideQuotes &&
                        text[i + 1] === '"'
                    ) {

                        value += '"';
                        i++;

                    } else {

                        insideQuotes = !insideQuotes;

                    }

                }

                else if (
                    char === "," &&
                    !insideQuotes
                ) {

                    row.push(value);
                    value = "";

                }

                else if (
                    (char === "\n" || char === "\r") &&
                    !insideQuotes
                ) {

                    row.push(value);

                    if (row.some(cell => cell.trim() !== "")) {
                        rows.push(row);
                    }

                    row = [];
                    value = "";

                    if (
                        char === "\r" &&
                        text[i + 1] === "\n"
                    ) {
                        i++;
                    }

                }

                else {

                    value += char;

                }

            }


            if (
                value !== "" ||
                row.length > 0
            ) {

                row.push(value);
                rows.push(row);

            }


            return rows;

        }


        input.addEventListener("change", async function () {

            const file = this.files[0];

            if (!file) {
                return;
            }


            resultat.textContent =
                "Lecture du CSV...";


            const text = await file.text();

            const rows = parseCSV(text);


            const vehicles = [];

            const usedIds = new Set();


            /*
                STRUCTURE RÉELLE DU CSV :

                colonne 0 = numéro
                colonne 1 = catégorie
                colonne 2 = véhicule
                colonne 3 = prix
            */


            for (let i = 1; i < rows.length; i++) {

                const columns = rows[i];


                const category =
                    (columns[1] || "").trim();


                const name =
                    (columns[2] || "").trim();


                const priceText =
                    (columns[3] || "").trim();


                if (
                    !category ||
                    !name ||
                    !priceText
                ) {
                    continue;
                }


                const price =
                    Number(
                        priceText
                            .replace(/\s/g, "")
                            .replace(",", ".")
                    );


                if (Number.isNaN(price)) {
                    continue;
                }


                let id = slugify(name);


                if (!id) {
                    id = "vehicule";
                }


                const baseId = id;

                let number = 2;


                while (usedIds.has(id)) {

                    id =
                        baseId +
                        "-" +
                        number;

                    number++;

                }


                usedIds.add(id);


                vehicles.push({

                    id: id,

                    name: name,

                    brand: "",

                    category: category,

                    price: price,

                    seats: 0,

                    trunk: 0,

                    image: "",

                    description: ""

                });

            }


            /*
                CRÉATION DU FICHIER JS
            */


            let output =
                "const vehicles = [\n\n";


            vehicles.forEach(
                (vehicle, index) => {

                    output += `    {
        id: ${JSON.stringify(vehicle.id)},
        name: ${JSON.stringify(vehicle.name)},
        brand: "",
        category: ${JSON.stringify(vehicle.category)},
        price: ${vehicle.price},
        seats: 0,
        trunk: 0,
        image: "",
        description: ""
    }`;


                    if (
                        index <
                        vehicles.length - 1
                    ) {

                        output += ",";

                    }


                    output += "\n\n";

                }
            );


            output += "];";


            /*
                BOUTON DE TÉLÉCHARGEMENT
            */


            const blob =
                new Blob(
                    [output],
                    {
                        type:
                            "text/javascript;charset=utf-8"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const button =
                document.createElement("a");


            button.href = url;

            button.download =
                "vehicles.js";

            button.textContent =
                "⬇ Télécharger vehicles.js";


            button.style.display =
                "block";

            button.style.marginTop =
                "20px";

            button.style.fontSize =
                "20px";


            document.body.appendChild(button);


            resultat.textContent =
                `${vehicles.length} véhicules trouvés`;

        });

    </script>

</body>

</html>
